<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <!-- Logo agregado aquí -->
            <div class="logo-container">
                <img src="imagenes/logo.png" alt="Logo" class="logo">
            </div>
            <h1>Crea tu cuenta</h1>
            <p>Únete a nuestra comunidad hoy y empieza a disfrutar de todos los beneficios.</p>
        </div>
        
        <div class="right-panel">
            <form>
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre completo">
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico">
                </div>

                <div class="form-group">
                    <label for="telefono">Número de teléfono</label>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="phone-prefix">+54</span>
                        <input type="tel" id="telefono" name="telefono" placeholder="11 2345 6789" class="phone-input">
                    </div>
                    <small class="phone-hint">Ejemplo: +54 11 2345 6789</small>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="········">
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirma contraseña</label>
                    <input type="password" id="confirm-password" placeholder="········">
                </div>
                <div class="divider"></div>
                <button type="submit" class="btn-register">Registrarse</button>
                
                <div class="terms">
                    Al registrarte, aceptas nuestros <a href="#">Términos de Servicio</a> y nuestra <a href="#">Política de Protocolos</a>!
                </div>
                
                <div class="social-register">
                    <p>O REGÍSTRATE CON:</p>
                    <div class="social-buttons">
                        <button type="button" class="social-btn">Google</button>
                        <button type="button" class="social-btn">Facebook</button>
                    </div>
                </div>
                
                <div class="login-link">
                    ¿Ya tienes una cuenta? <a href="#">Inicia sesión aquí</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
